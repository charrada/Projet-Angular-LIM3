<div class="container mt-5" style="max-width: 400px;">
  <h2 class="text-center mb-4">Register</h2>

  <div class="form-group mb-3">
    <label for="firstName">First Name</label>
    <input      type="text"      id="firstName"      class="form-control"      placeholder="Enter first name" [(ngModel)]="firstName"  required
    />
  </div>

  <div class="form-group mb-3">
    <label for="lastName">Last Name</label>
    <input
      type="text"
      id="lastName"
      class="form-control"
      placeholder="Enter last name"
      [(ngModel)]="lastName"
      required
    />
  </div>

  <div class="form-group mb-3">
    <label for="username">Username</label>
    <input
      type="text"
      id="username"
      class="form-control"
      placeholder="Enter username"
      [(ngModel)]="username"
      required
    />
  </div>

  <div class="form-group mb-3">
    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      class="form-control"
      placeholder="Enter email"
      [(ngModel)]="email"
      required
    />
  </div>

  <div class="form-group mb-3">
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      class="form-control"
      placeholder="Enter password"
      [(ngModel)]="password"
      required
    />
  </div>

  <button
    type="button"
    class="btn btn-success w-100"
    (click)="register()"
  >
    Register
  </button>
</div>
